[project]
name = "weekly-todo-widget"
version = "0.1.0"
description = "A local-first weekly todo widget for Linux"
requires-python = ">=3.11"

[project.scripts]
weekly-todo = "todo_widget.app:main"
weekly-todo-data = "todo_widget.bridge:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
